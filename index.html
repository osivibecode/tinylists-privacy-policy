<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyLists — Legal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #22543d;
            border-bottom: 2px solid #38a169;
            padding-bottom: 10px;
        }
        .subtitle {
            color: #718096;
            font-size: 0.95em;
            margin-bottom: 40px;
        }
        .card-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .card {
            display: block;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 30px 24px;
            width: 220px;
            text-decoration: none;
            color: #22543d;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s;
        }
        .card:hover {
            border-color: #38a169;
            box-shadow: 0 6px 18px rgba(56, 161, 105, 0.15);
            transform: translateY(-2px);
        }
        .card-icon {
            font-size: 2.5em;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 1.05em;
            font-weight: 700;
            color: #22543d;
            margin-bottom: 6px;
        }
        .card-desc {
            font-size: 0.82em;
            color: #718096;
        }
        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.9em;
            color: #a0aec0;
        }
        @media (max-width: 500px) {
            .card { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 TinyLists — Legal</h1>
    <p class="subtitle">TinyLists by osivibecode</p>

    <div class="card-grid">
        <a class="card" href="privacy_policy.html">
            <div class="card-icon">🔒</div>
            <div class="card-title">Privacy Policy</div>
            <div class="card-desc">How we handle your data and privacy.</div>
        </a>
        <a class="card" href="eula.html">
            <div class="card-icon">📄</div>
            <div class="card-title">EULA</div>
            <div class="card-desc">End User License Agreement and terms of use.</div>
        </a>
    </div>

    <div class="footer">
        &copy; 2026 osivibecode. All rights reserved.
    </div>
</div>
</body>
</html>
